name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One leg per PHP version the package supports, plus the oldest dependencies composer.json allows.
  # Pint runs on one leg, at an exact version: its rules move between releases, and composer.lock is not
  # committed. A newer Pint is a reviewed change to this pin, never a red check on an unrelated PR.
  test:
    name: PHP ${{ matrix.php }} · ${{ matrix.dependencies == 'lowest' && 'oldest allowed packages' || 'newest packages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            dependencies: lowest
          - php: '8.2'
            dependencies: highest
          - php: '8.4'
            dependencies: highest
            format: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCIES" = lowest ]; then
            composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable
          else
            composer update --no-interaction --no-progress --prefer-dist
          fi

      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite Unit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pint
        if: matrix.format
        run: |
          composer require --dev --no-interaction --no-progress --update-with-dependencies laravel/pint:1.32.1
          vendor/bin/pint --test

  generated:
    name: Generated code matches the spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate from spec/api.json
        run: sh scripts/generate.sh

      - name: Fail on any difference
        run: |
          git status --porcelain -- src/Generated
          test -z "$(git status --porcelain -- src/Generated)"

  # Compares the public API with the latest release. A breaking change needs a `feat!:` title; see scripts/bc-check.sh.
  # The tool is pinned and installed outside composer.json, because its own dependencies need PHP 8.4.
  bc:
    name: Public API stays compatible
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none

      - name: Install dependencies and the BC check
        run: |
          composer update --no-interaction --no-progress --prefer-dist
          composer global require --no-interaction --no-progress roave/backward-compatibility-check:8.23.0
          echo "$(composer global config bin-dir --absolute --quiet)" >> "$GITHUB_PATH"

      - name: Compare with the latest release
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: sh scripts/bc-check.sh

  # The one check branch protection requires, so a change to the matrix never edits the protection.
  ci:
    name: CI
    needs: [test, generated, bc]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.test.result }}
          GENERATED: ${{ needs.generated.result }}
          BC: ${{ needs.bc.result }}
        run: test "$RESULT" = success && test "$GENERATED" = success && { test "$BC" = success || test "$BC" = skipped; }

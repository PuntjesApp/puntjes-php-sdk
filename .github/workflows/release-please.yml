name: Release

# release-please keeps a release PR open from the conventional commits on main. That PR merges itself when CI is
# green; the merge tags the version, and Packagist reads the tag through its GitHub hook.
# Once Packagist serves a new tag, puntjes-laravel gets core-released and bumps its floor by itself.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Let the release PR merge itself when CI is green
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          number=$(printf '%s' "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || true)
          if [ -z "$number" ]; then
            echo "release-please opened or updated no release PR in this run."
            exit 0
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash

  # Its own job, so "Re-run failed jobs" sends the dispatch again: release-please reports a release only once.
  notify-laravel:
    name: Tell puntjes-laravel
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait until Packagist serves the tag
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS https://repo.packagist.org/p2/puntjes/php-sdk.json \
              | jq -e --arg v "$TAG" '.packages[][] | select(.version == $v)' > /dev/null; then
              echo "Packagist serves puntjes/php-sdk $TAG"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Packagist does not serve puntjes/php-sdk $TAG after 10 minutes. Check the GitHub hook on packagist.org"
          exit 1
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          owner: PuntjesApp
          repositories: puntjes-laravel
          permission-contents: write
      - name: Send core-released
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh api repos/PuntjesApp/puntjes-laravel/dispatches -f event_type=core-released -f "client_payload[tag]=${TAG}"
          echo "Sent core-released ${TAG} to PuntjesApp/puntjes-laravel."

  # Tells #alerts in the Puntjes Slack that a release went out or failed. A push without a release says nothing.
  # The webhook is the organisation secret SLACK_RELEASE_WEBHOOK; a Slack failure never fails this job.
  slack:
    name: Tell Slack
    needs: [release-please, notify-laravel]
    if: ${{ !cancelled() && (needs.release-please.result == 'failure' || needs.release-please.outputs.released == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post the result
        env:
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          RELEASE_RESULT: ${{ needs.release-please.result }}
          FOLLOW_UP_RESULT: ${{ needs.notify-laravel.result }}
          TAG: ${{ needs.release-please.outputs.tag }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RELEASE_RESULT" = 'success' ] && [ "$FOLLOW_UP_RESULT" = 'success' ]; then
            text=":package: ${REPO#*/} ${TAG} released. <${RUN_URL}|Workflow run>"
          else
            text=":x: ${REPO#*/} release ${TAG:-(no tag)} failed. Re-run the failed jobs. <${RUN_URL}|Workflow run>"
          fi
          if [ -z "${SLACK_RELEASE_WEBHOOK:-}" ]; then
            echo "::notice::No SLACK_RELEASE_WEBHOOK secret, so Slack gets no message."
            exit 0
          fi
          if ! jq -n --arg text "$text" '{text: $text}' |
            curl -sS --fail --max-time 10 -H 'Content-Type: application/json' -d @- "$SLACK_RELEASE_WEBHOOK" > /dev/null; then
            echo "::warning::Slack did not take the message."
          fi

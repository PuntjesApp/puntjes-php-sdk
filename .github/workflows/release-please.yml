name: Release

# release-please keeps a release PR open from the conventional commits on main. That PR merges itself when CI is
# green; the merge tags the version, and Packagist reads the tag through its GitHub hook.
# Once Packagist serves a new tag, puntjes-laravel gets core-released and bumps its floor by itself.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Let the release PR merge itself when CI is green
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          number=$(printf '%s' "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || true)
          if [ -z "$number" ]; then
            echo "release-please opened or updated no release PR in this run."
            exit 0
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash

  # Its own job, so "Re-run failed jobs" sends the dispatch again: release-please reports a release only once.
  notify-laravel:
    name: Tell puntjes-laravel
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait until Packagist serves the tag
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS https://repo.packagist.org/p2/puntjes/php-sdk.json \
              | jq -e --arg v "$TAG" '.packages[][] | select(.version == $v)' > /dev/null; then
              echo "Packagist serves puntjes/php-sdk $TAG"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Packagist does not serve puntjes/php-sdk $TAG after 10 minutes. Check the GitHub hook on packagist.org"
          exit 1
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          owner: PuntjesApp
          repositories: puntjes-laravel
          permission-contents: write
      - name: Send core-released
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh api repos/PuntjesApp/puntjes-laravel/dispatches -f event_type=core-released -f "client_payload[tag]=${TAG}"
          echo "Sent core-released ${TAG} to PuntjesApp/puntjes-laravel."

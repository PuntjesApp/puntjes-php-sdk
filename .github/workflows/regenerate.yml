name: Regenerate

# PuntjesApp/Puntjes sends spec-published after a release publishes a new api.json to puntjes-openapi. This turns it
# into a PR with the regenerated client. A minor or patch PR merges itself when CI is green; a major one waits.
on:
  repository_dispatch:
    types: [spec-published]

permissions: {}

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate from the published spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] the push of the regenerate branch needs the token
      - name: Plan
        id: plan
        env:
          TAG: ${{ github.event.client_payload.tag }}
          LEVEL: ${{ github.event.client_payload.level }}
          URL: ${{ github.event.client_payload.url }}
        run: php scripts/dispatch-plan.php "$TAG" "$LEVEL" "$URL" "$(cat spec/SOURCE)" >> "$GITHUB_OUTPUT"
      - name: Skip a branch that exists
        id: exists
        if: steps.plan.outputs.skip == 'false'
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::notice::$BRANCH exists, so this dispatch was handled already."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate, commit and open the PR
        if: steps.plan.outputs.skip == 'false' && steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.event.client_payload.tag }}
          URL: ${{ github.event.client_payload.url }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          TYPE: ${{ steps.plan.outputs.commit_type }}
          AUTO_MERGE: ${{ steps.plan.outputs.auto_merge }}
        run: |
          curl -fsSL "$URL" -o spec/api.json
          echo "$TAG" > spec/SOURCE
          sh scripts/generate.sh
          git config user.name "puntjes-sdk-bot[bot]"
          git config user.email "puntjes-sdk-bot[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add spec src/Generated
          git commit -m "${TYPE}: regenerate from puntjes-openapi ${TAG}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "${TYPE}: regenerate from puntjes-openapi ${TAG}" \
            --body "This client was regenerated from the published API spec ${TAG}. Never edit src/Generated by hand."
          if [ "$AUTO_MERGE" = true ]; then
            gh pr merge "$BRANCH" --auto --squash
          fi
